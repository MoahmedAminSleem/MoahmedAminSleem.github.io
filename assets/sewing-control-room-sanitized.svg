  <g fill="#F1EFE7" font-family="Arial" font-size="34" font-weight="700"><text x="103" y="367">WITHHELD</text><text x="362" y="367">WITHHELD</text><text x="621" y="367">WITHHELD</text><text x="880" y="367">WITHHELD</text></g>
