<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized sewing performance control room</title><desc id="desc">A visual architecture card based on a Power BI sewing overview, with all business metrics withheld.</desc>
