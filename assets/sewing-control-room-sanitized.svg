  <text x="82" y="684" fill="#14211D" fill-opacity=".64" font-family="monospace" font-size="12" letter-spacing="1">BASED ON VERIFIED PRIVATE POWER BI LAYOUT · NO COMPANY DATA DISPLAYED</text>
